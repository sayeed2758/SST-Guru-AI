ero h1{font-size:clamp(44px,6vw,72px);line-height:1.03;margin:24px 0 18px;letter-spacing:-.045em}.hero h1 span{background:linear-gradient(90deg,#5744eb,#8133ef);color:transparent;background-clip:text;-webkit-background-clip:text}.hero p{max-width:820px;margin:auto;color:var(--muted);font-size:20px;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px}.card{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:23px;text-align:left;box-shadow:var(--shadow);transition:.18s}.card:hover{transform:translateY(-2px)}.card .emoji{font-size:29px}.card strong{display:block;font-size:18px;margin-top:13px}.card small{display:block;color:var(--muted);margin-top:6px;line-height:1.45}.chat{margin-top:20px}.messages{display:grid;gap:20px}.msg{display:flex;gap:12px;align-items:flex-start}.avatar{width:42px;height:42px;border-radius:14px;background:#eef1ff;display:grid;place-items:center;flex:0 0 auto}.bubble{max-width:850px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px 19px;line-height:1.65;box-shadow:var(--shadow)}.msg.user{justify-content:flex-end}.msg.user .avatar{order:2;background:#e9e5ff}.msg.user .bubble{background:#ece9ff;border-color:#dcd6ff}.answer h3{margin:0 0 8px}.answer p{margin:8px 0}.answer ul{padding-left:23px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.mini,.btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:11px;padding:8px 11px}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:800}.btn.danger{color:var(--danger)}.composer-wrap{position:fixed;left:285px;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:18px 22px 20px;z-index:25}.composer{max-width:1000px;margin:auto;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,25,45,.12);border-radius:22px;padding:8px;display:flex;align-items:flex-end;gap:7px}.chips{max-width:1000px;margin:0 auto 8px;display:flex;gap:8px;overflow:auto;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;color:var(--muted);font-weight:750}.chip.active{color:var(--primary);border-color:#c9c2ff;background:#f0eeff}.composer textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);padding:11px 8px;min-height:48px;max-height:150px}.round,.send{width:48px;height:48px;border-radius:15px;border:0;background:var(--surface2);color:var(--text);font-size:20px}.send{background:linear-gradient(135deg,#5942ef,#7d35ef);color:#fff;font-size:25px}.note{text-align:center;color:var(--muted);font-size:11px;margin-top:7px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#eeecff;color:var(--primary);font-size:12px;font-weight:900}.field{margin:18px 0}.field label{display:block;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.08em;margin-bottom:8px}.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--text);padding:13px;outline:none}.textarea{resize:vertical}.copy{color:var(--muted);line-height:1.65}.feature{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}.feature span{display:block;color:var(--muted);margin-top:6px}.timeline{display:grid;gap:14px;margin-top:20px}.t{display:grid;grid-template-columns:100px 1fr;gap:14px}.year{font-weight:900;color:var(--primary);padding-top:16px}.tbox{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:15px}.tbox strong{display:block}.tbox span{display:block;color:var(--muted);margin-top:5px}.quizopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:13px;border-radius:13px;margin:8px 0}.quizopt.correct{border-color:#12b76a;background:#e9fbf2}.quizopt.wrong{border-color:#e5484d;background:#fff0f0}.empty{text-align:center;color:var(--muted);padding:60px 20px}.library-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:13px;border-radius:14px;margin-top:9px}.library-item small{display:block;color:var(--muted);margin-top:3px}.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,20px);background:#182033;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);display:grid;place-items:center;z-index:90;padding:18px}.modal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;font-size:22px;color:var(--muted)}
@media(max-width:820px){.sidebar{transform:translateX(-100%);transition:.22s;box-shadow:20px 0 50px rgba(0,0,0,.12)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.menu{display:block}.top{height:76px;padding:0 18px}.title{font-size:21px}.only{display:none}.content{padding:24px 18px 170px}.hero{padding:25px 0}.hero h1{font-size:48px}.hero p{font-size:17px}.grid{grid-template-columns:1fr;gap:12px}.composer-wrap{left:0;padding:10px 12px 14px}.two,.three{grid-template-columns:1fr}.t{grid-template-columns:70px 1fr}.kicker{font-size:12px}}
@media(max-width:430px){.hero h1{font-size:42px}.hero p{font-size:16px}.card{padding:19px}.bubble{max-width:calc(100vw - 78px);padding:14px}.composer{border-radius:18px}.chips{margin-bottom:7px}.chip{padding:8px 12px}.round,.send{width:44px;height:44px}}

<script>
"use strict";

/* ============================================================
   SST GURU AI — LAYERS 1–14
   Single-file, zero-dependency build.
   L1 UI
   L2 Navigation
   L3 Mode Engine
   L4 Intent Detection
   L5 SST Knowledge
   L6 Context/Follow-up Memory
   L7 Story Engine
   L8 Word/Vocabulary Engine
   L9 Comparison Engine
   L10 Timeline Engine
   L11 Exam Engine
   L12 Teacher + Quiz Engine
   L13 Personal Library
   L14 Optional Live AI Backend
   ============================================================ */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const STORE = "sst_guru_v7";
const SETTINGS = "sst_guru_settings_v7";

const DEFAULT = {
  page:"ask", mode:"normal", theme:"light", messages:[], docs:[],
  bookmarks:[], prefs:{language:"Hinglish",level:"CBSE",detail:"Deep but simple"}
};

let state = JSON.parse(localStorage.getItem(STORE) || "null") || DEFAULT;
let settings = JSON.parse(localStorage.getItem(SETTINGS) || "null") || {
  backend:"", model:"", temperature:"0.3"
};

document.body.className = state.theme === "dark" ? "dark" : "";

function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }
function saveSettings(){ localStorage.setItem(SETTINGS, JSON.stringify(settings)); }
function esc(x){
  return String(x ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function toast(x){
  const t=$("#toast"); if(!t)return;
  t.textContent=x; t.classList.add("show");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.remove("show"),1800);
}
function cleanText(x){ return String(x||"").replace(/[#*`|]/g," ").replace(/\s+/g," ").trim(); }
function format(x){
  let s=esc(x);
  s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>");
  s=s.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/^\s*[-•] (.*)$/gm,"<li>$1</li>");
  s=s.replace(/(?:<li>.*?<\/li>\s*)+/gs,m=>"<ul>"+m+"</ul>");
  s=s.replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");
  return '<div class="answer"><p>'+s+"</p></div>";
}

/* ---------------- L5: SST KNOWLEDGE ---------------- */
const KB = [
{subject:"History",title:"Adolf Hitler",tags:["hitler","adolf hitler","nazi","nazism","germany","world war 2","ww2","holocaust"],text:"Adolf Hitler was the leader of Nazi Germany. He became Chancellor in 1933 and established a dictatorship. Nazi ideology was racist, antisemitic and ultranationalist. The regime persecuted Jews and many other groups and carried out mass murder including the Holocaust. Germany invaded Poland in September 1939, leading Britain and France to declare war. Nazi Germany was defeated in 1945."},
{subject:"History",title:"French Revolution",tags:["french revolution","france","1789","bastille","monarchy","republic"],text:"The French Revolution began in 1789 amid social inequality, privileges, financial crisis, food hardship and political conflict. The Bastille became a famous symbol of revolutionary upheaval. The monarchy was eventually overthrown and France became a republic in 1792. The Revolution passed through radical phases and had major political and social consequences."},
{subject:"History",title:"Industrial Revolution",tags:["industrial revolution","industry","factory","steam","britain","machines"],text:"The Industrial Revolution was a major transformation from hand production toward machine production and factories. It began in Britain in the eighteenth century and spread more widely. Textile machinery, steam power, coal, iron, transport and factory organisation were important."},
{subject:"History",title:"Hyksos",tags:["hyksos","egypt","second intermediate period"],text:"The Hyksos were rulers who controlled parts of ancient Egypt, especially northern Egypt, during the Second Intermediate Period. Their origins and identity are complex and should not be reduced to one modern ethnic label."},
{subject:"History",title:"Renaissance",tags:["renaissance","humanism","europe","classical"],text:"The Renaissance was a period of cultural and intellectual change in Europe, especially from the fourteenth to sixteenth centuries. Humanism, renewed interest in classical learning, artistic experimentation and new approaches to knowledge were important."},
{subject:"History",title:"Colonialism",tags:["colonialism","colony","imperialism","empire"],text:"Colonialism involves a state establishing control over another territory and its people, often involving political domination, economic exploitation and cultural influence. Colonial systems varied by place and period."},
{subject:"History",title:"World War I",tags:["world war 1","ww1","first world war","1914","versailles"],text:"World War I was fought mainly from 1914 to 1918. Rival alliances, militarism, imperial competition and nationalism contributed to the crisis. The assassination of Archduke Franz Ferdinand in 1914 triggered the immediate crisis. The war ended with the defeat of the Central Powers and was followed by treaties including Versailles."},
{subject:"History",title:"World War II",tags:["world war 2","ww2","second world war","1939","1945"],text:"World War II was fought from 1939 to 1945. In Europe, Germany's invasion of Poland in September 1939 led Britain and France to declare war. The war involved multiple theatres, mass civilian suffering, the Holocaust and the defeat of the Axis powers in 1945."},
{subject:"History",title:"Nationalism",tags:["nationalism","nation","identity","politics"],text:"Nationalism is an idea that people sharing a sense of national identity should have political recognition or self-government. Nationalism has taken many forms and can influence movements for unification, independence or state-building."},
{subject:"History",title:"Imperialism",tags:["imperialism","empire","colonial rule"],text:"Imperialism is the extension of a state's power or influence over other territories or peoples. It may involve political control, economic influence or military domination."},
{subject:"Geography",title:"River",tags:["river","tributary","source","mouth","watercourse"],text:"A river is a natural flowing watercourse. It usually has a source and flows along a course toward a lower area, lake, sea, ocean or another river. A tributary is a smaller river or stream that joins a larger river."},
{subject:"Geography",title:"Sea",tags:["sea","salt water","coast"],text:"A sea is generally a smaller division of an ocean and is often partly enclosed by land. Seas are salt-water bodies and their names and boundaries can reflect geographical and historical conventions."},
{subject:"Geography",title:"Ocean",tags:["ocean","salt water","pacific","atlantic","indian"],text:"An ocean is a vast interconnected body of salt water. The commonly named oceans are Pacific, Atlantic, Indian, Southern and Arctic."},
{subject:"Geography",title:"Lake",tags:["lake","inland water","freshwater"],text:"A lake is a body of standing or relatively still water surrounded by land. It may be natural or artificial and may contain fresh or saline water."},
{subject:"Geography",title:"Weather",tags:["weather","atmosphere","temperature","rainfall"],text:"Weather describes short-term atmospheric conditions at a particular place and time, such as temperature, rainfall, wind or cloud cover."},
{subject:"Geography",title:"Climate",tags:["climate","long term","weather pattern"],text:"Climate describes the long-term pattern and average of weather over a region, assessed over many years."},
{subject:"Geography",title:"Weather vs Climate",tags:["weather climate","weather vs climate","difference"],text:"Weather is short-term atmospheric condition at a particular time and place. Climate is the long-term pattern and average of weather over a region."},
{subject:"Geography",title:"Latitude",tags:["latitude","equator","parallels","north south"],text:"Latitude measures angular distance north or south of the Equator and is represented by parallels of latitude."},
{subject:"Geography",title:"Longitude",tags:["longitude","meridian","prime meridian","east west"],text:"Longitude measures angular distance east or west of the Prime Meridian and is represented by meridians of longitude."},
{subject:"Geography",title:"Latitude vs Longitude",tags:["latitude longitude","latitude vs longitude","coordinates"],text:"Latitude measures angular distance north or south of the Equator. Longitude measures angular distance east or west of the Prime Meridian."},
{subject:"Geography",title:"Continent",tags:["continent","landmass"],text:"A continent is one of the large continuous or conventionally defined land areas of Earth. The common school model recognises seven continents."},
{subject:"Geography",title:"Island vs Peninsula",tags:["island peninsula","difference","landform"],text:"An island is land completely surrounded by water. A peninsula is land surrounded by water on most sides but connected to a larger landmass."},
{subject:"Civics",title:"Democracy",tags:["democracy","people","elections","representation","government"],text:"Democracy is a system in which political authority is based on the people, commonly exercised directly or through elected representatives. Participation, accountability, political equality and rights are important democratic ideas."},
{subject:"Civics",title:"Republic",tags:["republic","monarchy","state","hereditary"],text:"A republic is a form of state in which public authority is exercised through public institutions and representatives rather than a hereditary monarch. A republic can also be democratic."},
{subject:"Civics",title:"Democracy vs Republic",tags:["democracy republic","democracy vs republic","difference"],text:"Democracy mainly describes where political authority comes from: the people. Republic mainly describes a form of state in which public authority is not based on hereditary monarchy. A country can be both democratic and republican."},
{subject:"Civics",title:"Constitution",tags:["constitution","rights","law","government"],text:"A constitution is the fundamental framework of rules and principles by which a state is governed. It defines institutions, powers, procedures and often rights and limits on government."},
{subject:"Civics",title:"Fundamental Rights",tags:["fundamental rights","rights","india","constitution"],text:"Fundamental Rights are constitutionally protected rights in India that place important limits on state power and protect individual freedoms and equality."},
{subject:"Civics",title:"Rule of Law",tags:["rule of law","law","equality"],text:"Rule of law means that laws govern public authority and that people and institutions are subject to law rather than arbitrary personal power."},
{subject:"Economics",title:"Inflation",tags:["inflation","prices","purchasing power","money"],text:"Inflation is a sustained rise in the general level of prices over time. When prices rise faster than income, the purchasing power of money falls."},
{subject:"Economics",title:"GDP",tags:["gdp","gross domestic product","production","economy"],text:"Gross Domestic Product measures the monetary value of final goods and services produced within an economy during a specified period."},
{subject:"Economics",title:"Mercantilism",tags:["mercantilism","trade","colonialism","economic"],text:"Mercantilism describes a family of early modern economic ideas and state policies emphasising regulated trade, state power and wealth accumulation. Colonial trade and state intervention were important in several European systems."},
{subject:"Economics",title:"Demand vs Supply",tags:["demand supply","demand vs supply","market","economics"],text:"Demand refers to the quantity of a good or service consumers are willing and able to buy at different prices. Supply refers to the quantity producers are willing and able to offer at different prices."},
{subject:"Economics",title:"Primary Secondary Tertiary Sectors",tags:["primary sector","secondary sector","tertiary sector","sectors"],text:"The primary sector extracts or harvests natural resources, the secondary sector processes or manufactures goods, and the tertiary sector provides services."}
];

function allDocs(){ return KB.concat(state.docs.map(d=>({subject:"My Library",title:d.title,tags:[],text:d.text}))); }

/* ---------------- L4: INTENT DETECTION + L6 CONTEXT ---------------- */
function searchDocs(q){
  const s=String(q).toLowerCase().trim();
  const tokens=s.split(/[^a-z0-9]+/).filter(t=>t.length>1);
  return allDocs().map(d=>{
    const hay=(d.title+" "+d.subject+" "+(d.tags||[]).join(" ")+" "+d.text).toLowerCase();
    let score=0;
    if(hay.includes(s))score+=40;
    (d.tags||[]).forEach(t=>{const z=t.toLowerCase();if(s.includes(z)||z.includes(s))score+=16});
    tokens.forEach(t=>{if(hay.includes(t))score+=3});
    return {d,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.d);
}
function lastUser(){
  return [...state.messages].reverse().find(m=>m.role==="user")?.text || "";
}
function resolveFollowup(q){
  const s=q.toLowerCase().trim();
  if(/^(ha|haan|yes|ok|okay|samjhao|ha samjhao|detail|aur|continue|next|explain)\b/.test(s)){
    const prev=lastUser();
    if(prev && prev.toLowerCase()!==s)return prev+" — ab aur detail mein samjhao";
  }
  return q;
}
function detectIntent(q){
  const s=q.toLowerCase();
  if(/difference|vs\.?|versus|compare|antar|farak/.test(s))return "difference";
  if(/story|kahani|chronology|kaise hua|ki story/.test(s))return "story";
  if(/meaning|matlab|define|definition|word|term|shabd/.test(s))return "word";
  if(/timeline|chronological|kab|year wise/.test(s))return "timeline";
  if(/exam|5 mark|5 marks|answer|board|question/.test(s))return "exam";
  if(/teacher|class|students|samjhaun|padhau/.test(s))return "teacher";
  if(/quiz|mcq|test|practice/.test(s))return "quiz";
  return "normal";
}

/* ---------------- L7 STORY ENGINE ---------------- */
function storyAnswer(d,q){
 if(!d)return "### 📖 Story Mode\n\nTopic ka naam clear likho. Example: **Hitler ki story** ya **French Revolution ki story**.";
 if(d.title==="Adolf Hitler")return `### 📖 Hitler ki Story — scene by scene

**Scene 1 — Background:** World War I ke baad Germany political aur economic crisis se guzar raha tha. Is instability aur public resentment ko Nazi Party ne political support mein convert kiya.

**Scene 2 — 1933:** Hitler Chancellor bana. Power consolidate karne ke baad democratic institutions ko dismantle karke dictatorship establish ki gayi.

**Scene 3 — Ideology:** Nazi ideology extreme nationalism, racism aur antisemitism par based thi. Jews aur kai other groups persecution ke target bane.

**Scene 4 — 1939:** Germany ne September 1939 mein Poland invade kiya. Britain aur France ne Germany ke khilaf war declare ki.

**Scene 5 — Holocaust:** Nazi regime aur collaborators ne European Jews ke systematic persecution aur mass murder ko carry out kiya.

**Scene 6 — 1945:** Nazi Germany defeat hui aur Hitler April 1945 mein mar gaya.

### 🎯 Memory Chain
**Post-war crisis → Nazi rise → Dictatorship → Persecution → War → Holocaust → Defeat**`;
 if(d.title==="French Revolution")return `### 📖 French Revolution — Story

**Background:** French society mein unequal privileges, financial crisis, food hardship aur political conflict tha.

**1789:** Revolution begins. Bastille ka fall revolutionary upheaval ka famous symbol bana.

**Political change:** Old political order challenge hua; monarchy eventually overthrow hui.

**1792:** France became a republic.

**Radical phase:** Revolution increasingly radical hui aur political repression/violence ka period aaya.

**Aftermath:** Political instability ke baad Napoleon ka rise hua.

### 🎯 Memory
**Inequality → Crisis → Revolution → Republic → Radical phase → Napoleon**`;
 return `### 📖 ${d.title} — Story Mode

**Background:** ${d.text}

**Main change:** Is topic mein jo major transformation hua, usko identify karo.

/* ---------------- L9 COMPARISON ENGINE ---------------- */
function differenceAnswer(q,docs){
 const s=q.toLowerCase();
 if(/river.*sea.*ocean|river.*ocean.*sea/.test(s))return `### ⚖️ River vs Sea vs Ocean

| Concept | Easy meaning | Key idea |
|---|---|---|
| **River** | Natural flowing watercourse | **FLOW** |
| **Sea** | Salt-water body, generally smaller and often partly enclosed by land | **PARTLY ENCLOSED** |
| **Ocean** | Vast interconnected salt-water body | **VAST** |

**Example:** A river may flow into a sea; a sea is generally connected with an ocean.

### 🧠 Super-short memory
**River = flows**  
**Sea = smaller/partly enclosed salt water**  
**Ocean = huge salt-water body**`;
 if(/weather.*climate|climate.*weather/.test(s))return `### ⚖️ Weather vs Climate

**Weather:** Short-term atmospheric condition — “Aaj baarish ho rahi hai.”

**Climate:** Long-term pattern — “Is region mein generally monsoon season mein heavy rainfall hoti hai.”

| Point | Weather | Climate |
|---|---|---|
| Time | Short term | Long term |
| Question | What is happening now? | What is the usual pattern? |
| Example | Today's temperature | Regional average pattern |

### 🧠 Memory
**Weather = NOW** • **Climate = PATTERN**`;
 if(/latitude.*longitude|longitude.*latitude/.test(s))return `### ⚖️ Latitude vs Longitude

**Latitude:** Equator se north/south angular distance.

**Longitude:** Prime Meridian se east/west angular distance.

| Point | Latitude | Longitude |
|---|---|---|
| Reference | Equator | Prime Meridian |
| Direction | North / South | East / West |
| Lines | Parallels | Meridians |

### 🧠 Memory
**Latitude = flat/parallel** • **Longitude = long meridian lines**`;
 if(/democracy.*republic|republic.*democracy/.test(s))return `### ⚖️ Democracy vs Republic

**Democracy:** Political authority ka source **people** hain.

**Republic:** State ka head/public authority hereditary monarchy par based nahi hota.

**Important:** Democracy aur Republic opposite words nahi hain. A country **both democratic and republican** ho sakta hai.

### 🧠 Memory
**Democracy = Who gives political authority? → People**  
**Republic = What kind of state? → Non-hereditary public state**`;
 if(/island.*peninsula|peninsula.*island/.test(s))return `### ⚖️ Island vs Peninsula

**Island:** Completely surrounded by water.

**Peninsula:** Most sides se water, but larger landmass se connected.

### 🧠 Memory
**Island = water all around**  
**Peninsula = water around most sides + land connection**`;
 if(docs.length>=2)return `### ⚖️ Clear Difference

**${docs[0].title}:** ${docs[0].text}

**${docs[1].title}:** ${docs[1].text}

### Compare like a teacher
1. Definition
2. Main feature
3. Difference in role/function
4. Example
5. One-line memory trick`;
 return "### ⚖️ Difference Maker\n\nDono ya teen concepts ek saath likho. Example: **River vs Sea vs Ocean**, **Democracy vs Republic**, **Weather vs Climate**.";
}

/* ---------------- L14 OPTIONAL LIVE AI ---------------- */
async function liveAI(q){
 if(!settings.backend)return null;
 try{
   const ctrl=new AbortController();
   const timer=setTimeout(()=>ctrl.abort(),30000);
   const context=searchDocs(q).slice(0,10).map(d=>({
     subject:d.subject,title:d.title,text:d.text
   }));
   const payload={
     message:q,
     mode:state.mode,
     history:state.messages.slice(-16),
     context,
     preferences:state.prefs,
     previousInteractionId:localStorage.getItem("sst_guru_ai_interaction")||""
   };
   const r=await fetch(settings.backend.replace(/\/$/,"")+"/chat",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify(payload),
     signal:ctrl.signal
   });
   clearTimeout(timer);
   const d=await r.json();
   if(r.ok&&d.answer){
     if(d.interactionId)localStorage.setItem("sst_guru_ai_interaction",d.interactionId);
     return d.answer;
   }
 }catch(e){}
 return null;
}

 $(".close").onclick=()=>o.remove();
 $("#saveSettings").onclick=()=>{settings.backend=$("#backendUrl").value.trim();state.prefs.language=$("#lang").value;state.prefs.detail=$("#detail").value;state.prefs.level=$("#level").value||"CBSE";save();saveSettings();o.remove();toast("Settings saved")};
}
function voice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast("Voice input supported nahi hai");
 const r=new SR();r.lang="en-IN";r.onresult=e=>{$("#prompt").value=e.results[0][0].transcript;toast("Voice captured")};r.onerror=()=>toast("Voice input failed");r.start();
}
function say(t){if(!("speechSynthesis"in window))return toast("Read Aloud supported nahi");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cleanText(t));u.rate=.95;speechSynthesis.speak(u)}
function exportChat(){
 const txt=state.messages.map(m=>m.role.toUpperCase()+"\n"+m.text).join("\n\n---\n\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));a.download="sst-guru-conversation.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Conversation exported");
}
function render(){
 document.body.className=state.theme==="dark"?"dark":"";
 if(state.page==="ask")renderAsk();
 else if(["story","word","difference","exam","teacher"].includes(state.page))renderMode(state.page);
 else if(state.page==="timeline")renderTimeline();
 else if(state.page==="quiz")renderQuiz();
 else if(state.page==="library")renderLibrary();
 else if(state.page==="bookmarks")renderBookmarks();
 else renderAsk();
 $$(".nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
}
document.addEventListener("click",e=>{
 const nav=e.target.closest("[data-page]");
 if(nav){state.page=nav.dataset.page;state.mode=["story","word","difference","exam","teacher"].includes(state.page)?state.page:"normal";save();$("#sidebar")?.classList.remove("open");render();return}
 const a=e.target.closest("[data-action]");if(!a)return;
 const x=a.dataset.action;
 if(x==="new"){state.messages=[];state.page="ask";state.mode="normal";save();render();toast("New conversation")}
 if(x==="theme"){state.theme=state.theme==="dark"?"light":"dark";save();render();toast("Theme changed")}
 if(x==="clear"){if(confirm("Clear all local chats, library and saved answers?")){localStorage.removeItem(STORE);location.reload()}}
 if(x==="export")exportChat();
 if(x==="settings")settingsModal();
});
$("#menu").onclick=()=>$("#sidebar").classList.toggle("open");
window.addEventListener("error",()=>{if($("#content")&&!$("#content").children.length)$("#content").innerHTML=`<section class="panel"><h2>⚠️ SST GURU recovered</h2><p class="copy">Temporary browser error. Refresh once.</p><button class="btn primary" onclick="location.reload()">Refresh</button></section>`});
render();

</script>
</body>
</html>
