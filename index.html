<style>
:root{--bg:#f5f7fc;--surface:#fff;--surface2:#f8f9fd;--text:#172033;--muted:#697386;--line:#e4e7ef;--primary:#5b43ee;--primary2:#7b35ee;--good:#12b76a;--danger:#e5484d;--shadow:0 12px 35px rgba(24,32,56,.08);--radius:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
body.dark{--bg:#0d1322;--surface:#141c2e;--surface2:#101827;--text:#eef2ff;--muted:#a6afc2;--line:#283249;--shadow:0 12px 35px rgba(0,0,0,.28)}
.app{min-height:100vh;display:flex}.sidebar{width:285px;background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:12px;position:fixed;inset:0 auto 0 0;z-index:50}.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 18px}.brand-icon{width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,#5b43ee,#8c35ee);display:grid;place-items:center;font-size:27px}.brand strong{display:block;font-size:19px}.brand small{color:var(--primary);font-weight:800;letter-spacing:.08em}.new{border:0;color:#fff;background:linear-gradient(135deg,#5b43ee,#8a35ef);border-radius:16px;padding:15px;font-weight:800;font-size:16px;box-shadow:0 10px 25px rgba(91,67,238,.22)}.section{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.12em;padding:12px 10px 4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:13px;text-align:left;font-weight:700}.nav button:hover,.nav button.active{background:#eef0ff;color:var(--primary)}body.dark .nav button:hover,body.dark .nav button.active{background:#202843}.side-bottom{margin-top:auto}.main{margin-left:285px;width:calc(100% - 285px);min-width:0}.top{height:86px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}.menu{display:none;border:0;background:transparent;font-size:29px}.title{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:850}.dot{width:12px;height:12px;border-radius:50%;background:#12c77b;box-shadow:0 0 0 7px #dff9ec}.right{display:flex;align-items:center;gap:14px}.only{font-size:14px;font-weight:850;color:var(--muted)}.gear{border:0;background:transparent;font-size:28px}.content{max-width:1120px;margin:auto;padding:30px 26px 150px}.hero{text-align:center;padding:32px 0}.kicker{color:#5a46d9;font-weight:900;letter-spacing:.18em;font-size:14px}.hero h1{font-size:clamp(44px,6vw,72px);line-height:1.03;margin:24px 0 18px;letter-spacing:-.045em}.hero h1 span{background:linear-gradient(90deg,#5744eb,#8133ef);color:transparent;background-clip:text;-webkit-background-clip:text}.hero p{max-width:820px;margin:auto;color:var(--muted);font-size:20px;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px}.card{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:23px;text-align:left;box-shadow:var(--shadow);transition:.18s}.card:hover{transform:translateY(-2px)}.card .emoji{font-size:29px}.card strong{display:block;font-size:18px;margin-top:13px}.card small{display:block;color:var(--muted);margin-top:6px;line-height:1.45}.chat{margin-top:20px}.messages{display:grid;gap:20px}.msg{display:flex;gap:12px;align-items:flex-start}.avatar{width:42px;height:42px;border-radius:14px;background:#eef1ff;display:grid;place-items:center;flex:0 0 auto}.bubble{max-width:850px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px 19px;line-height:1.65;box-shadow:var(--shadow)}.msg.user{justify-content:flex-end}.msg.user .avatar{order:2;background:#e9e5ff}.msg.user .bubble{background:#ece9ff;border-color:#dcd6ff}.answer h3{margin:0 0 8px}.answer p{margin:8px 0}.answer ul{padding-left:23px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.mini,.btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:11px;padding:8px 11px}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:800}.btn.danger{color:var(--danger)}.composer-wrap{position:fixed;left:285px;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:18px 22px 20px;z-index:25}.composer{max-width:1000px;margin:auto;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,25,45,.12);border-radius:22px;padding:8px;display:flex;align-items:flex-end;gap:7px}.chips{max-width:1000px;margin:0 auto 8px;display:flex;gap:8px;overflow:auto;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;color:var(--muted);font-weight:750}.chip.active{color:var(--primary);border-color:#c9c2ff;background:#f0eeff}.composer textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);padding:11px 8px;min-height:48px;max-height:150px}.round,.send{width:48px;height:48px;border-radius:15px;border:0;background:var(--surface2);color:var(--text);font-size:20px}.send{background:linear-gradient(135deg,#5942ef,#7d35ef);color:#fff;font-size:25px}.note{text-align:center;color:var(--muted);font-size:11px;margin-top:7px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#eeecff;color:var(--primary);font-size:12px;font-weight:900}.field{margin:18px 0}.field label{display:block;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.08em;margin-bottom:8px}.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--text);padding:13px;outline:none}.textarea{resize:vertical}.copy{color:var(--muted);line-height:1.65}.feature{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}.feature span{display:block;color:var(--muted);margin-top:6px}.timeline{display:grid;gap:14px;margin-top:20px}.t{display:grid;grid-template-columns:100px 1fr;gap:14px}.year{font-weight:900;color:var(--primary);padding-top:16px}.tbox{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:15px}.tbox strong{display:block}.tbox span{display:block;color:var(--muted);margin-top:5px}.quizopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:13px;border-radius:13px;margin:8px 0}.quizopt.correct{border-color:#12b76a;background:#e9fbf2}.quizopt.wrong{border-color:#e5484d;background:#fff0f0}.empty{text-align:center;color:var(--muted);padding:60px 20px}.library-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:13px;border-radius:14px;margin-top:9px}.library-item small{display:block;color:var(--muted);margin-top:3px}.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,20px);background:#182033;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);display:grid;place-items:center;z-index:90;padding:18px}.modal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;font-size:22px;color:var(--muted)}
@media(max-width:820px){.sidebar{transform:translateX(-100%);transition:.22s;box-shadow:20px 0 50px rgba(0,0,0,.12)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.menu{display:block}.top{height:76px;padding:0 18px}.title{font-size:21px}.only{display:none}.content{padding:24px 18px 170px}.hero{padding:25px 0}.hero h1{font-size:48px}.hero p{font-size:17px}.grid{grid-template-columns:1fr;gap:12px}.composer-wrap{left:0;padding:10px 12px 14px}.two,.three{grid-template-columns:1fr}.t{grid-template-columns:70px 1fr}.kicker{font-size:12px}}
@media(max-width:430px){.hero h1{font-size:42px}.hero p{font-size:16px}.card{padding:19px}.bubble{max-width:calc(100vw - 78px);padding:14px}.composer{border-radius:18px}.chips{margin-bottom:7px}.chip{padding:8px 12px}.round,.send{width:44px;height:44px}}
</style>
</head>

<script>
"use strict";
const KB=[
["History","Adolf Hitler",["hitler","adolf hitler","nazi","nazism","germany"],"Adolf Hitler was the leader of Nazi Germany. He became Chancellor in 1933 and established a dictatorship. Nazi ideology was racist, antisemitic and ultranationalist. His regime persecuted Jews and many other groups and was responsible for mass murder including the Holocaust. Germany invaded Poland in September 1939, leading Britain and France to declare war. Nazi Germany was defeated in 1945."],
["History","French Revolution",["french revolution","france","1789","bastille"],"The French Revolution began in 1789 amid social inequality, privileges, financial crisis, food hardship and political conflict. The Bastille became a famous symbol of revolutionary upheaval. The monarchy was eventually overthrown and France became a republic in 1792. The Revolution passed through radical phases and had major political and social consequences."],
["History","Industrial Revolution",["industrial revolution","industry","factory","steam","britain"],"The Industrial Revolution was a major transformation from hand production toward machine production and factories. It began in Britain in the eighteenth century and spread more widely. Textile machinery, steam power, coal, iron, transport and factory organisation were important."],
["History","Hyksos",["hyksos","egypt","second intermediate period"],"The Hyksos were rulers who controlled parts of ancient Egypt, especially northern Egypt, during the Second Intermediate Period. Their origins and identity are complex and should not be reduced to one modern ethnic label."],
["Geography","River",["river","tributary","source","watercourse"],"A river is a natural flowing watercourse. It usually has a source and flows along a course toward a lower area, lake, sea, ocean or another river. A tributary is a smaller river or stream that joins a larger river."],
["Geography","Sea",["sea","salt water"],"A sea is generally a smaller division of an ocean and is often partly enclosed by land. Seas are salt-water bodies, and their boundaries can also reflect historical and geographical conventions."],
["Geography","Ocean",["ocean","salt water"],"An ocean is a vast interconnected body of salt water. The commonly named oceans are Pacific, Atlantic, Indian, Southern and Arctic."],
["Geography","Lake",["lake","inland water"],"A lake is a body of standing or relatively still water surrounded by land. It may be natural or artificial and may contain fresh or saline water."],
["Geography","Weather vs Climate",["weather","climate"],"Weather describes short-term atmospheric conditions at a particular place and time. Climate describes long-term patterns and averages of weather over a region."],
["Geography","Latitude vs Longitude",["latitude","longitude","equator","meridian"],"Latitude measures angular distance north or south of the Equator and uses parallels. Longitude measures angular distance east or west of the Prime Meridian and uses meridians."],
["Civics","Democracy",["democracy","people","elections","government"],"Democracy is a system in which political authority is based on the people, commonly exercised directly or through elected representatives. Participation, accountability, political equality and rights are important democratic ideas."],
["Civics","Republic",["republic","monarchy","state"],"A republic is a form of state in which public authority is exercised through public institutions and representatives rather than a hereditary monarch. A republic can also be democratic."],
["Civics","Democracy vs Republic",["democracy republic","difference"],"Democracy mainly describes where political authority comes from: the people. Republic mainly describes a form of state in which public authority is not based on hereditary monarchy. A country can be both democratic and republican."],
["Civics","Constitution",["constitution","rights","law"],"A constitution is the fundamental framework of rules and principles by which a state is governed. It defines institutions, powers, procedures and often rights and limits on government."],
["Economics","Inflation",["inflation","prices","purchasing power"],"Inflation is a sustained rise in the general level of prices over time. When prices rise faster than income, the purchasing power of money falls."],
["Economics","GDP",["gdp","production","economy"],"Gross Domestic Product measures the monetary value of final goods and services produced within an economy during a specified period."],
["Economics","Mercantilism",["mercantilism","trade","colonialism"],"Mercantilism describes a family of early modern economic ideas and state policies emphasizing regulated trade, state power and wealth accumulation. Colonial trade and state intervention were important in several European systems."]
];
const KEY="sst_guru_v6";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{page:"ask",mode:"normal",theme:"light",messages:[],docs:[]};
document.body.className=state.theme==="dark"?"dark":"";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(x){const t=$("#toast");t.textContent=x;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),1600)}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function format(x){let s=esc(x);s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/^\s*[-•] (.*)$/gm,"<li>$1</li>").replace(/(?:<li>.*?<\/li>\s*)+/gs,m=>"<ul>"+m+"</ul>").replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");return '<div class="answer"><p>'+s+"</p></div>"}
function search(q){let s=q.toLowerCase();return KB.map(d=>{let h=(d[1]+" "+d[0]+" "+d[2].join(" ")+" "+d[3]).toLowerCase(),score=0;if(h.includes(s))score+=30;d[2].forEach(t=>{if(s.includes(t)||t.includes(s))score+=12});s.split(/[^a-z0-9]+/).filter(Boolean).forEach(t=>{if(h.includes(t))score+=2});return{d,score}}).filter(x=>x.score).sort((a,b)=>b.score-a.score).map(x=>x.d)}
function lastTopic(){return [...state.messages].reverse().find(x=>x.role==="user")?.text||""}
function answer(q){
 let s=q.toLowerCase().trim();
 if(/^(ha|haan|yes|ok|okay|samjhao|ha samjhao|detail|aur|continue)\b/.test(s)&&lastTopic())q=lastTopic()+" — ab aur detail mein samjhao";
 let r=search(q),d=r[0], mode=state.mode;
 if(mode==="story")return story(d,q); if(mode==="word")return word(d,q); if(mode==="difference")return diff(q,r); if(mode==="exam")return exam(d,q); if(mode==="teacher")return teacher(d,q);
 if(!d)return "### 🧠 SST GURU AI\n\nIs exact topic ka starter entry abhi available nahi hai.\n\nAap History, Geography, Civics ya Economics ka topic pooch sakte hain. Example: **French Revolution**, **River vs Sea vs Ocean**, **Mercantilism**, **Democracy vs Republic**, **Hitler ki story**.";
 return `### 🧠 ${d[1]}\n\n**Simple explanation:** ${d[3]}\n\n**Hinglish:** ${hinglish(d)}\n\n**Memory trick:** ${memory(d)}\n\n**Next:** Isi topic ko Story, Word, Difference, Exam ya Teacher mode mein khol sakte ho.`;
}
function hinglish(d){const n=d[1];if(n==="River")return"River ko simple language mein flowing water ka natural path samjho. Ye source se nikal kar neeche ki taraf flow karti hai aur lake, sea, ocean ya another river tak pahunch sakti hai.";if(n==="Sea")return"Sea salt water ka relatively smaller part hota hai jo aksar land se partly enclosed hota hai.";if(n==="Ocean")return"Ocean bahut huge interconnected salt-water body hai.";if(n==="Democracy vs Republic")return"Democracy ka focus people ki political authority par hai; Republic ka focus hereditary monarch ke bina public state structure par hai.";return"Is concept ko definition + background + example + consequence ke chain se yaad rakho."}
function memory(d){return d[1]==="Adolf Hitler"?"1933 → Dictatorship → 1939 War → Holocaust → 1945 defeat":d[1]==="River"?"RIVER = FLOW":d[1]==="Sea"?"SEA = OCEAN KA PART":d[1]==="Ocean"?"OCEAN = VAST SALT WATER":"Definition → Example → Consequence"}
function story(d,q){if(!d)return "### 📖 Story Mode\n\nTopic ka naam thoda clear likho. Example: **Hitler ki story**, **French Revolution ki story**.";if(d[1]==="Adolf Hitler")return `### 📖 Hitler ki Story\n\n**Background — Germany after World War I:** Germany political aur economic crisis se guzar raha tha. Nazi Party ne resentment aur instability ka political advantage liya.\n\n**1933 — Power:** Hitler Chancellor bana aur democratic institutions ko dismantle karke dictatorship establish ki.\n\n**Nazi ideology:** Extreme nationalism, racism aur antisemitism central the. Jews aur kai other groups persecution aur mass murder ke target bane.\n\n**1939 — War:** Germany invaded Poland in September 1939. Britain and France declared war.\n\n**Holocaust:** Nazi regime aur collaborators ne European Jews ke systematic persecution aur mass murder ko carry out kiya.\n\n**1945 — End:** Nazi Germany defeated hui; Hitler died in April 1945.\n\n### 🎯 Memory Chain\n**Crisis → Nazi rise → Dictatorship → Persecution → War → Holocaust → Defeat**`;
if(d[1]==="French Revolution")return `### 📖 French Revolution — Story\n\n**Background:** Social inequality, privileges, financial crisis aur food hardship.\n\n**1789:** Revolution begins; Bastille revolutionary upheaval ka famous symbol bana.\n\n**Political change:** Old political order challenge hua aur monarchy eventually overthrow hui.\n\n**1792:** France became a republic.\n\n**Aftermath:** Radical phase, political violence aur later Napoleon ka rise.\n\n### 🎯 Memory\n**Inequality → Crisis → Revolution → Republic → Radical phase → Napoleon**`;
return `### 📖 ${d[1]} — Story Mode\n\n**Background:** ${d[3]}\n\n**Turning point:** Is topic ka major change identify karo.\n\n**Consequence:** Change ke baad society, politics, economy ya geography par kya effect hua?\n\n**Memory:** Background → Change → Consequence → Legacy`;}
function word(d,q){return `### 🔎 Word Explainer\n\n**Word:** ${esc(d?d[1]:q)}\n\n**Simple English:** ${d?d[3]:"Exact starter entry nahi mila."}\n\n**Hinglish:** ${d?hinglish(d):"Meaning ko sentence aur example ke context mein samjho."}\n\n**Example:** Is word ko real classroom situation se connect karo.\n\n**Memory:** ${d?memory(d):"Meaning → Context → Example"}`;}
function diff(q,r){if(/river.*sea.*ocean|sea.*ocean.*river/i.test(q))return `### ⚖️ River vs Sea vs Ocean\n\n| River | Sea | Ocean |\n|---|---|---|\n| Flowing watercourse | Salt-water body, generally smaller and partly enclosed | Vast interconnected salt-water body |\n| Usually has a source and course | Often connected to an ocean | Contains seas and covers huge areas |\n| Example: a river flowing to a sea | Example: Arabian Sea | Example: Indian Ocean |\n\n### 🧠 Shortcut\n**River = FLOW** • **Sea = PARTLY ENCLOSED** • **Ocean = VAST**`;
if(r.length>=2)return `### ⚖️ Difference Maker\n\n**${r[0][1]}:** ${r[0][3]}\n\n**${r[1][1]}:** ${r[1][3]}\n\n### 🧠 Easy rule\nPehle definition compare karo, phir size/role/function, phir example.`;
return "### ⚖️ Difference Maker\n\nDo terms ek saath likho. Example: **Democracy vs Republic** ya **Weather vs Climate**."}
function exam(d,q){return `### 🎯 Exam Mode — ${esc(d?d[1]:q)}\n\n**Introduction:** ${d?d[3]:"Topic ki one-line definition se start karo."}\n\n**Answer structure:**\n- Meaning / definition\n- 2–3 causes or features\n- Important event/process\n- Consequences\n- Suitable example\n\n**5-mark formula:** Introduction → 4–5 clear points → example → conclusion.`}
function teacher(d,q){return `### 👨‍🏫 Teacher Studio — ${esc(d?d[1]:q)}\n\n**Class opener:** “Is concept ko ek familiar real-life situation se connect karte hain.”\n\n**Core explanation:** ${d?d[3]:"Topic ko simple definition se start karo."}\n\n**Board flow:** Definition → Background → Example → Cause/Effect → Common confusion → Recap.\n\n**Ask students:** “Agar ye condition change ho jaye, result kya badlega?”`}
function hero(){const c=[["📖","History Story","Hitler / French Revolution","story"],["🌊","Geography Basics","River vs Sea vs Ocean","difference"],["🔎","Hard Word","Mercantilism / difficult terms","word"],["⚖️","Compare","Democracy vs Republic","difference"],["⏳","Timeline","Build chronology","timeline"],["🧠","Quiz Lab","Practice concepts","quiz"],["🎯","Exam Mode","Exam-ready answers","exam"],["👨‍🏫","Teacher Studio","Classroom explanations","teacher"]];return `<section class="hero"><div class="kicker">YOUR PERSONAL SOCIAL SCIENCE AI</div><h1>Samajhna hai?<br><span>Story ki tarah samjho.</span></h1><p>History, Geography, Civics & Economics — simple Hinglish, deep concepts, clear examples, comparisons, timelines, quizzes and classroom tools.</p><div class="grid">${c.map(x=>`<button class="card" data-page="${x[3]}"><span class="emoji">${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></button>`).join("")}</div></section>`}
function composer(){let c=[["normal","🧠 Explain"],["story","📖 Story"],["word","🔎 Word"],["difference","⚖️ Difference"],["exam","🎯 Exam"],["teacher","👨‍🏫 Teacher"]];return `<div class="composer-wrap"><div class="chips">${c.map(x=>`<button class="chip ${state.mode===x[0]?"active":""}" data-mode="${x[0]}">${x[1]}</button>`).join("")}</div><div class="composer"><button class="round" id="mic">🎙️</button><textarea id="prompt" rows="1" placeholder="Example: River vs Sea vs Ocean"></textarea><button class="round" id="read">🔊</button><button class="send" id="send">➤</button></div><div class="note">SST ONLY • Offline brain active • Live backend optional</div></div>`}
function renderAsk(){state.page="ask";$("#pageTitle").textContent="Ask SST";$("#content").innerHTML=hero()+`<div class="chat"><div class="messages">${state.messages.length?state.messages.map((m,i)=>`<div class="msg ${m.role==="assistant"?"ai":"user"}"><div class="avatar">${m.role==="assistant"?"📚":"👨‍🏫"}</div><div class="bubble">${m.role==="assistant"?format(m.text):esc(m.text)}${m.role==="assistant"?`<div class="tools"><button class="mini" data-copy="${i}">Copy</button><button class="mini" data-simple="${i}">Make Simpler</button><button class="mini" data-say="${i}">Read Aloud</button></div>`:""}</div></div>`).join(""):`<div class="empty">👋 <strong>Namaste Sir!</strong><br>History, Geography, Civics ya Economics ka question poochho.</div>`}</div></div>${composer()}`;bind()}
function bind(){ $$("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.mode=["story","word","difference","exam","teacher"].includes(state.page)?state.page:"normal";save();render()});$$("[data-mode]").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();renderAsk();$("#prompt").focus()});$("#send").onclick=()=>send();$("#prompt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("#prompt").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(150,e.target.scrollHeight)+"px"};$("#read").onclick=()=>{let a=[...state.messages].reverse().find(x=>x.role==="assistant");a?say(a.text):toast("Answer nahi hai")};$("#mic").onclick=voice;$$("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(state.messages[+b.dataset.copy].text);toast("Copied")});$$("[data-say]").forEach(b=>b.onclick=()=>say(state.messages[+b.dataset.say].text));$$("[data-simple]").forEach(b=>b.onclick=()=>{let x=state.messages[+b.dataset.simple]?.text||"";state.messages.push({role:"user",text:"Isko aur simple Hinglish mein samjhao"});state.messages.push({role:"assistant",text:"### 🧠 Simple Version\n\n"+x.replace(/[#*]/g,"").slice(0,3000)+"\n\n**Memory:** Definition → Example → Recap"});save();renderAsk()})}
function send(){let v=$("#prompt").value.trim();if(!v)return toast("Question likho");state.messages.push({role:"user",text:v});state.messages.push({role:"assistant",text:answer(v)});save();renderAsk();setTimeout(()=>{let m=document.querySelector(".messages");m?.lastElementChild?.scrollIntoView({behavior:"smooth",block:"center"})},30)}
function renderMode(p){let info={story:["📖","Story Mode","Background → conflict → turning point → consequence"],word:["🔎","Word Explainer","Difficult word ko English + Hinglish + example mein break karo"],difference:["⚖️","Difference Maker","Confusing concepts ka clear comparison"],exam:["🎯","Exam Mode","Exam-ready structure and keywords"],teacher:["👨‍🏫","Teacher Studio","Classroom-ready explanation"]}[p];$("#pageTitle").textContent=info[1];$("#content").innerHTML=`<div class="two"><section class="panel"><span class="badge">${info[0]} ${info[1]}</span><h2>${info[1]}</h2><p class="copy">${info[2]}</p><div class="field"><label>TOPIC / QUESTION</label><textarea class="textarea" id="modeInput" rows="5" placeholder="Type your SST topic..."></textarea></div><button class="btn primary" id="run">Generate</button> <button class="btn" id="toAsk">Open Ask SST</button></section><section class="panel"><h3>Learning flow</h3><div class="three"><div class="feature"><strong>🧠 Understand</strong><span>Simple first, depth later.</span></div><div class="feature"><strong>🗣️ Explain</strong><span>Hinglish + examples.</span></div><div class="feature"><strong>🎯 Remember</strong><span>Recap + memory.</span></div></div></section></div>`;$("#run").onclick=()=>{let q=$("#modeInput").value.trim();if(!q)return toast("Topic likho");state.messages.push({role:"user",text:q});state.messages.push({role:"assistant",text:answer(q)});state.page="ask";save();renderAsk()};$("#toAsk").onclick=()=>{state.page="ask";save();renderAsk()};bind()}
function timeline(){let q=prompt("Timeline topic:","Hitler");if(!q)return;state.page="ask";state.mode="normal";state.messages.push({role:"user",text:"Timeline: "+q});let s=q.toLowerCase(),a=s.includes("hitler")?[["1919","Post-war Germany","Political and economic instability"],["1933","Hitler becomes Chancellor","Dictatorship established"],["1939","Poland invaded","Britain and France declare war"],["1941–45","Holocaust and total war","Mass persecution and murder"],["1945","Nazi Germany defeated","Hitler dies in April"]]:s.includes("french")?[["1789","Revolution begins","Inequality, crisis and political conflict"],["1789","Bastille","Symbol of revolutionary upheaval"],["1792","Republic","Monarchy overthrown; republic established"],["1793–94","Radical phase","Revolutionary repression"],["1799","Napoleon","Coup ends the Directory"]]:[["Background","Before","Identify conditions"],["Turning point","Main event","Identify the change"],["Aftermath","After","Record consequences"],["Legacy","Why it matters","Connect later developments"]];state.messages.push({role:"assistant",text:"### ⏳ Timeline — "+q+"\n\n"+a.map(x=>`**${x[0]} — ${x[1]}:** ${x[2]}`).join("\n\n")});save();renderAsk()}
function quiz(){let q=prompt("Quiz topic:","Geography");if(!q)return;let pool=q.toLowerCase().includes("hitler")?[["Hitler became Chancellor in?",["1920","1933","1939","1945"],1],["Germany invaded Poland in?",["1933","1938","1939","1945"],2]]:[["A river is usually?",["Flowing watercourse","Ocean","Climate","Government"],0],["Climate means?",["Long-term weather pattern","Today's weather only","River flow","Election"],0]];let i=0,score=0;function draw(){state.page="quiz";$("#pageTitle").textContent="Quiz Lab";$("#content").innerHTML=`<section class="panel"><span class="badge">🧠 QUIZ LAB</span><h2>Question ${i+1}/${pool.length}</h2><h3>${pool[i][0]}</h3>${pool[i][1].map((o,n)=>`<button class="quizopt" data-q="${n}">${o}</button>`).join("")}<p class="copy">Score: ${score}</p></section>`;$$("[data-q]").forEach(b=>b.onclick=()=>{let n=+b.dataset.q;if(n===pool[i][2]){score++;b.classList.add("correct")}else{b.classList.add("wrong");$$("[data-q]")[pool[i][2]].classList.add("correct")}setTimeout(()=>{i++;if(i<pool.length)draw();else{alert("Quiz complete! Score: "+score+"/"+pool.length);render()}},500)})}draw()}
function library(){state.page="library";$("#pageTitle").textContent="My SST Library";$("#content").innerHTML=`<div class="two"><section class="panel"><span class="badge">📚 PERSONAL LIBRARY</span><h2>My SST Library</h2><p class="copy">Text/Markdown/CSV files locally index karo.</p><input class="input" id="files" type="file" multiple accept=".txt,.md,.csv,.json"><br><br><button class="btn primary" id="index">Index Files</button> <button class="btn danger" id="wipe">Remove Library</button></section><section class="panel"><h3>Indexed material</h3>${state.docs.length?state.docs.map((d,i)=>`<div class="library-item"><div><strong>${esc(d.title)}</strong><small>${d.text.length} characters</small></div><button class="mini" data-del="${i}">Remove</button></div>`).join(""):"<div class='empty'>No personal files yet.</div>"}</section></div>`;$("#index").onclick=async()=>{for(const f of $("#files").files){let t=await f.text();state.docs.push({title:f.name,text:t.slice(0,100000)})}save();library();toast("Files indexed")};$("#wipe").onclick=()=>{state.docs=[];save();library()};$$("[data-del]").forEach(b=>b.onclick=()=>{state.docs.splice(+b.dataset.del,1);save();library()})}
function settings(){let o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal"><div class="modalhead"><h2>⚙️ Settings</h2><button class="close">✕</button></div><div class="field"><label>AI BACKEND URL (OPTIONAL)</label><input class="input" id="api" placeholder="https://your-worker.workers.dev"></div><p class="copy">API key yahan mat rakho. Frontend offline SST brain already works.</p><button class="btn primary" id="saveSet">Save</button></div>`;document.body.appendChild(o);$(".close").onclick=()=>o.remove();$("#saveSet").onclick=()=>{localStorage.setItem("sst_backend",$("#api").value.trim());o.remove();toast("Settings saved")}}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast("Voice input browser mein supported nahi");let r=new SR();r.lang="en-IN";r.onresult=e=>{$("#prompt").value=e.results[0][0].transcript;toast("Voice captured")};r.start()}
function say(t){if(!speechSynthesis)return toast("Read Aloud supported nahi");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.replace(/[#*|]/g," "));u.rate=.95;speechSynthesis.speak(u)}
function render(){document.body.className=state.theme==="dark"?"dark":"";if(state.page==="ask")renderAsk();else if(["story","word","difference","exam","teacher"].includes(state.page))renderMode(state.page);else if(state.page==="timeline"){timeline()}else if(state.page==="quiz"){quiz()}else if(state.page==="library"){library()}else renderAsk();$$("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
document.addEventListener("click",e=>{let a=e.target.closest("[data-action]");if(!a)return;let x=a.dataset.action;if(x==="new"){state.messages=[];state.page="ask";state.mode="normal";save();renderAsk();toast("New conversation")};if(x==="theme"){state.theme=state.theme==="dark"?"light":"dark";save();render();toast("Theme changed")};if(x==="clear"){if(confirm("Clear all local data?")){localStorage.removeItem(KEY);location.reload()}};if(x==="export"){let txt=state.messages.map(m=>m.role.toUpperCase()+"\n"+m.text).join("\n\n---\n\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));a.download="sst-guru-conversation.txt";a.click();toast("Exported")};if(x==="settings")settings()});
$("#menu").onclick=()=>$("#sidebar").classList.toggle("open");
window.addEventListener("error",e=>{if(!$("#content"))return;$("#content").innerHTML=`<section class="panel"><h2>⚠️ SST GURU recovered</h2><p class="copy">A temporary browser error occurred. Refresh once. Your saved chats are safe.</p><button class="btn primary" onclick="location.reload()">Refresh</button></section>`});
render();
</script>
</body>
</html>
