<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>SST GURU AI</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">📚</div>
      <div><strong>SST GURU</strong><small>PERSONAL AI</small></div>
    </div>
    <button class="new-chat" id="newChat">＋ New Conversation</button>

    <div class="nav-title">LEARN</div>
    <nav>
      <button class="nav-btn active" data-page="ask">💬 <span>Ask SST</span></button>
      <button class="nav-btn" data-page="story">📖 <span>Story Mode</span></button>
      <button class="nav-btn" data-page="word">🔎 <span>Word Explainer</span></button>
      <button class="nav-btn" data-page="difference">⚖️ <span>Difference Maker</span></button>
      <button class="nav-btn" data-page="timeline">⏳ <span>Timeline Builder</span></button>
      <button class="nav-btn" data-page="quiz">🧠 <span>Quiz Lab</span></button>
    </nav>

    <div class="nav-title">TEACH</div>
    <nav>
      <button class="nav-btn" data-page="exam">🎯 <span>Exam Mode</span></button>
      <button class="nav-btn" data-page="teacher">👨‍🏫 <span>Teacher Studio</span></button>
      <button class="nav-btn" data-page="library">📚 <span>My SST Library</span></button>
    </nav>

    <div class="sidebar-bottom">
      <button class="nav-btn" id="themeBtn">🌙 <span>Toggle Theme</span></button>
      <button class="nav-btn" id="exportBtn">⬇️ <span>Export Conversation</span></button>
      <button class="nav-btn danger" id="clearBtn">🗑️ <span>Clear Local Data</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="page-title"><i></i><span id="pageTitle">Ask SST</span></div>
      <div class="top-right">
        <span class="sst-badge">SST ONLY</span>
        <button class="gear" id="settingsBtn">⚙️</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/knowledge.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
